description: "Estimate menstrual cycle phase, next period and phase-aware training, nutrition and hydration guidance with the stateless cycle-coach MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `wellness-cycle-coach@0.4.3` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: no network service and no storage: every call computes from period start dates passed in the arguments. Tools that change state: cycle_profile_update (local preferences only). Estimates are statistical and must not be used for contraception or fertility decisions. Cycle history is sensitive: ask before pulling it from another connector and do not repeat dates unnecessarily. The tool set comes from the pinned npm version, not from this repository's source tree."
