description: "Read the user's Polar training sessions, nightly recharge, sleep and activity through the local polar MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `polar-mcp-unofficial@0.6.0` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: the official Polar AccessLink Dynamic API v4. Credentials and OAuth tokens are created by the connector's own `setup`/`auth` commands in the user's terminal and stay on the machine (`~/.polar-mcp/`); the plugin declares no environment variables and reads no Hermes credentials. Tools that change state: polar_profile_update (local profile only); polar_exchange_code (stores OAuth tokens locally); polar_revoke_access (revokes the Polar grant and deletes local tokens). The tool set comes from the pinned npm version, not from this repository's source tree."
