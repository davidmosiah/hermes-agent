description: "Read the user's Strava activities, segments and training load through the local strava MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `strava-mcp-unofficial@0.7.0` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: the official Strava API v3. Credentials and OAuth tokens are created by the connector's own `setup`/`auth` commands in the user's terminal and stay on the machine (`~/.strava-mcp/`); the plugin declares no environment variables and reads no Hermes credentials. Tools that change state: strava_profile_update (local profile only); strava_exchange_code (stores OAuth tokens locally); strava_revoke_access (revokes the Strava grant and deletes local tokens). The tool set comes from the pinned npm version, not from this repository's source tree."
