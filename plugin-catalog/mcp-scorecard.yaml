description: "Score any MCP server for security, quality and agent-readiness (0-100, per-check findings) with the mcp-scorecard MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `mcp-scorecard@0.5.13` npm package locally over stdio through `npx` (Node.js 22+ required); the package is downloaded from npm on first start. Data source: it audits the subject the user names: an npm package or GitHub repo is downloaded and started locally to probe its MCP surface; an https URL is probed remotely. Auditing an npm package or repository executes that third-party code on this machine with the user's privileges. Only audit subjects the user named, and say so before running one. The tool set comes from the pinned npm version, not from this repository's source tree."
