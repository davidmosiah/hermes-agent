description: "Read the user's Withings weight, body composition, blood pressure, sleep and activity through the local withings MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `withings-mcp-unofficial@0.6.0` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: the official Withings Public API. Credentials and OAuth tokens are created by the connector's own `setup`/`auth` commands in the user's terminal and stay on the machine (`~/.withings-mcp/`); the plugin declares no environment variables and reads no Hermes credentials. Tools that change state: withings_profile_update (local profile only); withings_exchange_code (stores OAuth tokens locally); withings_revoke_access (revokes the Withings grant and deletes local tokens). The tool set comes from the pinned npm version, not from this repository's source tree. Upgrade and rollback require stopping every Withings instance sharing the token file and upgrading all clients together; old and new token locks do not coordinate. Legacy tokens without userid require reauthorization before refresh or multi-page reads."
