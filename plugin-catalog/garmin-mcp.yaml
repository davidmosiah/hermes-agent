description: "Read the user's Garmin Body Battery, HRV status, sleep, stress, training readiness and activities through the local garmin MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `garmin-mcp-unofficial@0.8.0` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: Garmin Connect in unofficial personal mode (Garmin has no public consumer API): the user logs in locally once and the connector reuses the resulting Garmin Connect tokens. Credentials and OAuth tokens are created by the connector's own `setup`/`auth` commands in the user's terminal and stay on the machine (`~/.garmin-mcp/`); the plugin declares no environment variables and reads no Hermes credentials. Tools that change state: garmin_profile_update (local profile only); garmin_disconnect_local (deletes the local Garmin tokens). Unofficial: Garmin may change or rate-limit the private Connect endpoints this mode relies on. The tool set comes from the pinned npm version, not from this repository's source tree."
