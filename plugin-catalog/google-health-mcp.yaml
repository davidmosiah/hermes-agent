description: "Read the user's Fitbit and Pixel Watch data through the Google Health API v4 via the local google-health MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `google-health-mcp-unofficial@0.8.0` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: the official Google Health API v4 (Fitbit and Pixel Watch data) with Google OAuth 2.0. Credentials and OAuth tokens are created by the connector's own `setup`/`auth` commands in the user's terminal and stay on the machine (`~/.google-health-mcp/`); the plugin declares no environment variables and reads no Hermes credentials. Tools that change state: google_health_profile_update (local profile only); google_health_exchange_code (stores OAuth tokens locally); google_health_revoke_access (revokes the Google Health grant and deletes local tokens). The tool set comes from the pinned npm version, not from this repository's source tree."
