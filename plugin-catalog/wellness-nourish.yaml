description: "Search foods, estimate and log meals and water, and track nutrition goals with the local nourish MCP server (USDA FoodData Central, Open Food Facts barcodes, local SQLite diary). Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `wellness-nourish@0.9.0` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: USDA FoodData Central for food search (free key optional, DEMO_KEY otherwise) and Open Food Facts for barcodes; meals, water and goals are stored only in a local SQLite file. Tools that change state: nourish_log_intake / nourish_bulk_log_intake / nourish_update_intake; nourish_log_water; nourish_set_goals; nourish_remember_meal; nourish_profile_update; nourish_delete_intake, nourish_clear_day, nourish_delete_water, nourish_clear_hydration_day, nourish_forget_memory, nourish_undo_last (local diary only). Log a meal only after the user confirms the estimate; show the estimate first with nourish_estimate_meal. Photo tools decode images the agent passes in; nothing is uploaded automatically. The tool set comes from the pinned npm version, not from this repository's source tree."
