description: "Check indoor and outdoor air quality (PM2.5, PM10, CO2, TVOC, AQI) with the local wellness-air MCP server, using public AirGradient sensors or the user's own monitors. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `wellness-air@0.7.3` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: public AirGradient sensors (no key) and, optionally, the user's own AirGradient, Airthings, PurpleAir, IQAir or Awair account through provider tokens. Tools that change state: air_profile_update (local preferences only). Air-quality guidance is general wellness information, not a medical or safety alert system. The tool set comes from the pinned npm version, not from this repository's source tree."
