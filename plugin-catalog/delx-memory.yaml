description: "Keep durable, searchable memory across sessions and agents with the local delx-memory MCP server (SQLite on this machine). Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `delx-memory@0.4.1` npm package locally over stdio through `npx` (Node.js 20+ required); the package is downloaded from npm on first start. Data source: no network service: a local SQLite database at ~/.delx-memory/db.sqlite (override with DELX_MEMORY_PATH). Tools that change state: memory_set / memory_set_batch; memory_forget, memory_forget_by_tag (local rows only). Never store secrets, credentials or other people's personal data in memory. Any agent on this machine that runs delx-memory reads the same database. The tool set comes from the pinned npm version, not from this repository's source tree."
